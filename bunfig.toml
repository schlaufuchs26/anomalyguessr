[test]
preload = ["./tests/happydom.ts", "./tests/testing-library.ts"]

# api/ is its own Bun package (ticket #1261) with a dedicated CI job: keep its
# tests out of the frontend's discovery and coverage so the two suites stay
# independent (root preload/code coverage assume the frontend).
pathIgnorePatterns = ["api/**"]

# Coverage enabled by default; thresholds fail the run if not met
coverage = true
# coverageSkipTestFiles has a bug in Bun 1.3.14; use path patterns instead
coveragePathIgnorePatterns = ["tests/**"]
coverageThreshold = { lines = 0.75, functions = 0.75, statements = 0.75 }
