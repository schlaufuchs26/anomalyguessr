name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No pip step: the ag_* modules and their suites are stdlib-only. The
      # tests shell out to ImageMagick (convert), which ships on the runner.
      # They were moved here from the fuchs repo in ticket #1261.
      - run: python3 -m unittest discover -s pipeline -t pipeline -p 'test_ag_*.py'
